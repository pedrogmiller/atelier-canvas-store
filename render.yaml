services:
  - type: web
    name: atelier-canvas-gallery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn storefront.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: STORE_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GELATO_API_KEY
        sync: false
